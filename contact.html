<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact | Body Art Cabaret</title>
<meta name="description" content="Get in touch with Body Art Cabaret.">

<!-- Bootstrap 5 -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">

<style>
  :root{
    --void:#130910;
    --plum:#2A1122;
    --velvet:#54132F;
    --gold:#C9A24B;
    --gold-soft:#E4CD97;
    --blush:#E7B7BE;
    --ivory:#F4EBDD;
    --font-marquee:'Bebas Neue', sans-serif;
    --font-display:'Cormorant Garamond', serif;
    --font-body:'EB Garamond', serif;
  }

  *{box-sizing:border-box;}

  body{
    background:var(--void);
    color:var(--ivory);
    font-family:var(--font-body);
    font-size:1.08rem;
    line-height:1.7;
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }

  h1,.font-display{font-family:var(--font-display); font-weight:600;}
  a{color:var(--gold-soft); text-decoration:none;}
  a:hover{color:var(--gold);}
  ::selection{background:var(--gold); color:var(--void);}

  /* ---------- Nav ---------- */
  .navbar{
    background:rgba(19,9,16,.85);
    backdrop-filter:blur(6px);
    border-bottom:1px solid rgba(201,162,75,.25);
    padding-top:.9rem; padding-bottom:.9rem;
  }
  .navbar-brand{
    font-family:var(--font-marquee); font-size:1.5rem; letter-spacing:.18em;
    color:var(--gold-soft) !important;
  }
  .navbar-brand span{color:var(--blush);}
  .nav-link{
    font-family:var(--font-marquee); font-size:.85rem; letter-spacing:.12em;
    color:var(--ivory) !important; margin:0 .5rem;
  }
  .nav-link:hover, .nav-link.active{color:var(--gold) !important;}

  /* ---------- Contact main ---------- */
  main{
    flex:1;
    display:flex;
    align-items:center;
    position:relative;
    padding:8rem 0 5rem;
    background:
      radial-gradient(ellipse 60% 50% at 50% 20%, rgba(122,31,61,.5), transparent 70%),
      radial-gradient(ellipse 80% 60% at 50% 100%, rgba(84,19,47,.35), transparent 70%),
      var(--void);
  }
  main::before{
    content:"";
    position:absolute; inset:0;
    background-image:repeating-radial-gradient(circle at 50% 0, rgba(201,162,75,.05) 0 2px, transparent 2px 40px);
    pointer-events:none;
  }

  .contact-wrap{
    position:relative;
    max-width:560px;
    margin:0 auto;
    background:rgba(244,235,221,.03);
    border:1px solid rgba(201,162,75,.3);
    padding:3rem 2.5rem;
  }
  .eyebrow{
    font-family:var(--font-marquee); letter-spacing:.35em; color:var(--blush);
    font-size:.8rem; text-align:center; display:block; margin-bottom:.6rem;
  }
  .contact-wrap h1{
    font-size:clamp(2.2rem,5vw,3rem);
    font-style:italic;
    text-align:center;
    margin-bottom:2.2rem;
    color:var(--ivory);
  }

  .form-label{
    font-family:var(--font-marquee);
    letter-spacing:.1em;
    font-size:.82rem;
    color:var(--gold-soft);
    margin-bottom:.4rem;
  }
  .form-control{
    background:rgba(19,9,16,.6);
    border:1px solid rgba(201,162,75,.35);
    color:var(--ivory);
    border-radius:2px;
    padding:.7rem .9rem;
  }
  .form-control:focus{
    background:rgba(19,9,16,.75);
    border-color:var(--gold);
    box-shadow:0 0 0 .2rem rgba(201,162,75,.2);
    color:var(--ivory);
  }
  .form-control::placeholder{color:#8A7580;}
  textarea.form-control{min-height:140px; resize:vertical;}

  .btn-gold{
    background:linear-gradient(180deg, var(--gold-soft), var(--gold));
    color:var(--void); border:none; font-family:var(--font-marquee);
    letter-spacing:.12em; padding:.75rem 1.8rem; border-radius:2px;
    width:100%;
  }
  .btn-gold:hover{background:var(--gold-soft); color:var(--void);}

  /* ---------- Footer ---------- */
  footer{
    background:var(--void);
    padding:2rem 0;
    border-top:1px solid rgba(201,162,75,.15);
    font-size:.82rem;
    color:#8A7580;
    text-align:center;
  }
  footer a{color:#CDB9C0;}
  footer a:hover{color:var(--gold-soft);}
</style>
</head>
<body>

<!-- NAV -->
<nav class="navbar navbar-expand-lg fixed-top">
  <div class="container">
    <a class="navbar-brand" href="bodyartcabaret.html">BODY ART <span>CABARET</span></a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav" style="border-color:rgba(201,162,75,.5);">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse justify-content-end" id="nav">
      <ul class="navbar-nav">
        <li class="nav-item"><a class="nav-link" href="about.html">The Company</a></li>
        <li class="nav-item"><a class="nav-link" href="bodyartcabaret.html#acts">The Acts</a></li>
        <li class="nav-item"><a class="nav-link" href="bodyartcabaret.html#tour">On Tour</a></li>
        <li class="nav-item"><a class="nav-link" href="bodyartcabaret.html#gallery">Gallery</a></li>
        <li class="nav-item"><a class="nav-link active" href="contact.html">Contact</a></li>
      </ul>
    </div>
  </div>
</nav>

<!-- CONTACT -->
<main>
  <div class="container">
    <div class="contact-wrap">
      <span class="eyebrow">GET IN TOUCH</span>
      <h1>Contact</h1>
      <form action="mailto:booking@bodyartcabaret.example" method="post" enctype="text/plain">
        <div class="mb-3">
          <label for="name" class="form-label">NAME</label>
          <input type="text" class="form-control" id="name" name="name" required>
        </div>
        <div class="mb-3">
          <label for="email" class="form-label">EMAIL</label>
          <input type="email" class="form-control" id="email" name="email" required>
        </div>
        <div class="mb-3">
          <label for="subject" class="form-label">SUBJECT</label>
          <input type="text" class="form-control" id="subject" name="subject">
        </div>
        <div class="mb-4">
          <label for="message" class="form-label">MESSAGE</label>
          <textarea class="form-control" id="message" name="message" required></textarea>
        </div>
        <button type="submit" class="btn btn-gold">Send Message</button>
      </form>
    </div>
  </div>
</main>

<footer>
  &copy; <span id="year"></span> Body Art Cabaret. All rights reserved.
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script>
  document.getElementById('year').textContent = new Date().getFullYear();
</script>
</body>
</html>
